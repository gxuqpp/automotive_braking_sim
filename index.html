<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车制动性能仿真工具 · 广西大学</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "微软雅黑", "Microsoft YaHei", sans-serif; background: var(--bg); color: #222; font-size: 14px; }
.app-header { background: var(--header-bg); color: white; padding: 14px 20px; }
.app-header h1 { font-size: 18px; font-weight: 700; }
.app-header .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; line-height: 1.6; }
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.result-table th { background: #e8eef8; padding: 8px 10px; text-align: left; border: 1px solid var(--border); font-weight: 600; color: var(--blue); }
.result-table td { padding: 7px 10px; border: 1px solid var(--border); vertical-align: top; }
.result-table tr:nth-child(even) td { background: #f8faff; }
.info-box { background: #fffbea; border: 1px solid #f0d96a; border-radius: 5px; padding: 10px 14px; font-size: 12px; color: #5a4800; margin: 8px 0; }

.sim-wrap {
  --sim-bg:     #080d18;
  --sim-panel:  #0e1525;
  --sim-border: #1a2d48;
  --sim-accent: #00d4ff;
  --sim-text:   #ddeaf8;
  --sim-muted:  #91a8c4;
  background: var(--sim-bg);
  color: var(--sim-text);
  border-radius: 8px;
  overflow: hidden;
  font-family: "微软雅黑","Microsoft YaHei",sans-serif;
}
.sim-body-row {
  display: flex;
  height: clamp(520px, calc(100vh - 340px), 760px);
}
.sim-side {
  width: 320px;
  background: var(--sim-panel);
  border-right: 1px solid var(--sim-border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.sim-side::-webkit-scrollbar{width:4px;}
.sim-side::-webkit-scrollbar-thumb{background:var(--sim-border);border-radius:3px;}
.sim-tab-nav {
  border-bottom: 1px solid var(--sim-border);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sim-tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--sim-muted);
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  font-weight: 500;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.sim-tab-btn:hover{color:var(--sim-text);background:rgba(255,255,255,.05);}
.sim-tab-btn.active{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.35);color:var(--sim-accent);}
.sim-param-section{padding:14px;flex:1;}
.sim-param-group{margin-bottom:18px;}
.sim-param-group-title{font-size:14px;color:var(--sim-accent);font-weight:700;margin-bottom:10px;}
.sim-param-row{margin-bottom:12px;}
.sim-param-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:6px;}
.sim-param-label span:first-child{font-size:14px;color:var(--sim-text);}
.sim-param-numbox {
  font-family: monospace;
  font-size: 14px;
  color: var(--sim-accent);
  background: rgba(0,212,255,.08);
  border: 1.5px solid rgba(0,212,255,.3);
  border-radius: 5px;
  padding: 5px 8px;
  width: 86px;
  text-align: right;
  outline: none;
  -moz-appearance: textfield;
}
.sim-param-numbox::-webkit-outer-spin-button,
.sim-param-numbox::-webkit-inner-spin-button{-webkit-appearance:none;}
.sim-param-numbox:focus{border-color:var(--sim-accent);box-shadow:0 0 0 2px rgba(0,212,255,.18);}
.sim-param-unit{font-size:12px;color:var(--sim-muted);white-space:nowrap;}
.sim-reset-btn {
  width:100%;margin-top:6px;padding:9px;
  background:transparent;border:1px solid var(--sim-border);
  color:var(--sim-muted);border-radius:5px;cursor:pointer;
  font-family:monospace;font-size:13px;letter-spacing:.06em;
  transition:all .2s;
}
.sim-reset-btn:hover{border-color:var(--sim-accent);color:var(--sim-accent);}
.sim-dyn-add-btn{
  background:rgba(57,255,20,.1);border:1px solid rgba(57,255,20,.35);
  color:#39ff14;padding:3px 8px;border-radius:4px;font-size:12px;cursor:pointer;
}
.sim-dyn-add-btn:hover{background:rgba(57,255,20,.2);}
.sim-dyn-del-btn{
  background:transparent;border:1px solid rgba(255,80,80,.35);
  color:rgba(255,100,100,.8);width:26px;height:26px;border-radius:4px;
  font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.sim-dyn-del-btn:hover{background:rgba(255,80,80,.15);color:#ff5050;}
.sim-main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.sim-chart-panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.sim-chart-panel.active{display:flex;}
.sim-chart-header{
  padding:12px 16px 10px;border-bottom:1px solid var(--sim-border);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.sim-chart-title{font-size:16px;font-weight:700;color:#fff;flex:1;}
.sim-dl-btn{
  background:rgba(0,212,255,.1);border:1.5px solid rgba(0,212,255,.35);
  color:var(--sim-accent);padding:6px 12px;border-radius:5px;
  font-size:13px;font-family:monospace;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.sim-dl-btn:hover{background:rgba(0,212,255,.2);border-color:var(--sim-accent);}
.sim-canvas-wrap{flex:1;position:relative;min-height:0;overflow:hidden;}
canvas.sim-canvas{position:absolute;inset:0;width:100%;height:100%;}
.sim-info-bar{
  display:flex;gap:8px;padding:8px 16px;
  border-top:1px solid var(--sim-border);flex-shrink:0;flex-wrap:wrap;
}

:root {
  --blue: #1a4a8a;
  --bg: #f0f4fb;
  --border: #c8d8f0;
  --header-bg: #1a3560;
}
.standalone { width: 100%; max-width: 1440px; margin: 0 auto; padding: 12px 16px 20px; }
.sim-case-results { margin-bottom: 12px; }
.sim-case-results .info-box { margin-top: 0; }
.sim-table { overflow-x: auto; }
.sim-table th, .sim-table td { text-align: left; }
.sim-table th:first-child, .sim-table td:first-child { white-space: nowrap; }
.sim-table .result-table { margin-top: 0; background: white; }
.sim-model-note { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #50627b; }

.sim-toolbar {
  background: var(--sim-panel); border-bottom: 1px solid var(--sim-border);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px 16px;
}
.sim-input-state { font-size: 13px; color: var(--sim-text); line-height: 1.5; }
.sim-case-option { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.sim-case-option select, .sim-field select {
  font: inherit; color: var(--sim-text); background: #172941; border: 1px solid #3c5576;
  border-radius: 5px; padding: 5px 7px;
}
.sim-settings { padding: 12px 14px; }
.sim-settings summary { color: var(--sim-accent); cursor: pointer; font-weight: 700; padding: 2px 0; }
.sim-settings .sim-param-group { margin: 14px 0 0; }
.sim-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sim-field { min-width: 0; }
.sim-field label { display: block; line-height: 1.35; margin-bottom: 5px; font-size: 12px; }
.sim-field input, .sim-field select { width: 100%; min-height: 31px; }
.sim-field-note { margin-top: 8px; font-size: 12px; line-height: 1.5; color: var(--sim-muted); }
.sim-field input:disabled { opacity: .5; }
.sim-field input:invalid, .sim-param-row input:invalid { border-color: #ff8585; }
.sim-preset { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.sim-preset .sim-reset-btn { width: auto; padding: 6px 8px; margin: 0; min-height: 31px; font-size: 12px; }
.sim-param-section { border-bottom: 1px solid var(--sim-border); flex: none; }
.sim-param-section .sim-param-group-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sim-series-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sim-series-fields .sim-param-row { margin: 0; min-width: 0; }
.sim-series-fields input { width: 100%; min-width: 0; }
.sim-series-fields label { font-size: 12px; }
.sim-dyn-add-btn:disabled, .sim-dl-btn:disabled { opacity: .45; cursor: default; }
.sim-info-bar { color: var(--sim-text); font-size: 13px; line-height: 1.5; }
.sim-tab-btn:focus-visible, .sim-settings summary:focus-visible, .sim-dl-btn:focus-visible {
  outline: 2px solid var(--sim-accent); outline-offset: 2px;
}
[hidden] { display: none !important; }
@media (max-width: 760px) {
  .standalone { padding: 8px 10px 16px; }
  .sim-table th, .sim-table td { padding: 7px 6px; }
  .sim-body-row { flex-direction: column; height: auto; }
  .sim-side { width: 100%; border-right: 0; border-bottom: 1px solid var(--sim-border); overflow-y: visible; }
  .sim-tab-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sim-tab-btn { font-size: 13px; padding: 8px; }
  .sim-canvas-wrap { flex: none; height: 360px; }
}

</style>
<script>
// 防止右键及查看源代码快捷键
(function () {
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var c = e.code || '';
    var ctrl = e.ctrlKey || e.metaKey;
    if (e.key === 'F12' || c === 'F12' ||
        (ctrl && !e.shiftKey && !e.altKey && (c === 'KeyU' || c === 'KeyS')) ||
        (ctrl && e.shiftKey && (c === 'KeyI' || c === 'KeyJ' || c === 'KeyC')) ||
        (e.metaKey && e.altKey && (c === 'KeyI' || c === 'KeyJ' || c === 'KeyC' || c === 'KeyU'))) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
})();
</script>
</head>
<body>
  <header class="app-header">
    <h1>汽车制动性能仿真工具</h1>
    <p class="sub">广西大学 · 车辆工程专业 · 《汽车设计》课程教学团队</p>
  </header>
  <main class="standalone">
    <section class="sim-case-results" aria-label="统一校核结果">
      <p class="info-box" id="simScenario"></p>
      <p class="info-box" id="simError" role="status" hidden></p>
      <div class="sim-table" id="simulationCaseResults"></div>
      <p class="sim-model-note">制动距离从操纵开始计，含机构延迟与线性建压。模型按平路、恒定附着计算，轮胎纵向力在各轴附着上限处封顶。</p>
    </section>
    <div class="sim-wrap">
      <div class="sim-toolbar">
        <p class="sim-input-state" id="simInputState"></p>
        <label class="sim-case-option" for="simLoad">距离曲线载荷
          <select id="simLoad"><option value="full">满载</option><option value="empty">空载</option></select>
        </label>
      </div>
      <div class="sim-body-row">
        <aside class="sim-side" aria-label="仿真控制">
          <nav class="sim-tab-nav" aria-label="曲线类型">
          <button type="button" class="sim-tab-btn active" aria-pressed="true" onclick="simSwitchTab(0)">制动力分配曲线</button>
          <button type="button" class="sim-tab-btn" aria-pressed="false" onclick="simSwitchTab(1)">利用附着系数曲线</button>
          <button type="button" class="sim-tab-btn" aria-pressed="false" onclick="simSwitchTab(2)">制动效率曲线</button>
          <button type="button" class="sim-tab-btn" aria-pressed="false" onclick="simSwitchTab(3)">制动距离 vs 附着系数</button>
          <button type="button" class="sim-tab-btn" aria-pressed="false" onclick="simSwitchTab(4)">制动距离 vs 初速度</button>
        </nav>
          <div class="sim-param-section" id="sim-params-3" hidden>
            <h3 class="sim-param-group-title">制动初速度
              <button type="button" class="sim-dyn-add-btn" id="sim-add-speed" onclick="simAddSpeed()">＋ 添加</button>
            </h3>
            <div class="sim-series-fields" id="sim-speed-inputs"></div>
          </div>
          <div class="sim-param-section" id="sim-params-4" hidden>
            <h3 class="sim-param-group-title">路面附着系数
              <button type="button" class="sim-dyn-add-btn" id="sim-add-mu" onclick="simAddMu()">＋ 添加</button>
            </h3>
            <div class="sim-series-fields" id="sim-mu-inputs"></div>
          </div>
          <details class="sim-settings" id="sim-settings" open>
            <summary>仿真参数</summary>
            <div class="sim-param-group sim-preset">
              <div class="sim-field">
                <label for="simPreset">参考工况</label>
                <select id="simPreset">
                  <option value="disc">17.90 盘式工况</option>
                  <option value="drum">17.91 鼓式工况</option>
                </select>
              </div>
              <button type="button" class="sim-reset-btn" id="simReset">恢复预设</button>
            </div>
            <div id="sim-parameters">
              <div class="sim-param-group">
                <h3 class="sim-param-group-title">质量与质心</h3>
                <div class="sim-fields">
                  <div class="sim-field">
                    <label for="m0">空载质量 <span class="sim-param-unit">kg</span></label>
                    <input class="sim-param-numbox" type="number" id="m0" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="ma">满载质量 <span class="sim-param-unit">kg</span></label>
                    <input class="sim-param-numbox" type="number" id="ma" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="hg_empty">空载质心高 <span class="sim-param-unit">mm</span></label>
                    <input class="sim-param-numbox" type="number" id="hg_empty" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="hg_full">满载质心高 <span class="sim-param-unit">mm</span></label>
                    <input class="sim-param-numbox" type="number" id="hg_full" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="front_empty">空载前轴荷占比 <span class="sim-param-unit">%</span></label>
                    <input class="sim-param-numbox" type="number" id="front_empty" min="0" max="100" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="front_full">满载前轴荷占比 <span class="sim-param-unit">%</span></label>
                    <input class="sim-param-numbox" type="number" id="front_full" min="0" max="100" step="any">
                  </div>
                </div>
              </div>
              <div class="sim-param-group">
                <h3 class="sim-param-group-title">车辆与制动系统</h3>
                <div class="sim-fields">
                  <div class="sim-field">
                    <label for="L">轴距 L <span class="sim-param-unit">mm</span></label>
                    <input class="sim-param-numbox" type="number" id="L" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="re">车轮有效半径 <span class="sim-param-unit">mm</span></label>
                    <input class="sim-param-numbox" type="number" id="re" min="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="pressureMode">前后轴压力分配</label>
                    <select id="pressureMode">
                      <option value="matched">按设计 β 配压</option>
                      <option value="equal">前后同压</option>
                    </select>
                  </div>
                  <div class="sim-field">
                    <label for="beta">设计分配系数 β</label>
                    <input class="sim-param-numbox" type="number" id="beta" min="0" max="1" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="gainFront">前轴单侧力矩增益 <span class="sim-param-unit">N·m/MPa</span></label>
                    <input class="sim-param-numbox" type="number" id="gainFront" min="0" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="gainRear">后轴单侧力矩增益 <span class="sim-param-unit">N·m/MPa</span></label>
                    <input class="sim-param-numbox" type="number" id="gainRear" min="0" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="pressure">可用管压 <span class="sim-param-unit">MPa</span></label>
                    <input class="sim-param-numbox" type="number" id="pressure" min="0" step="any">
                  </div>
                </div>
                <p class="sim-field-note">单侧力矩增益等于该轴单侧制动器力矩除以对应轮缸压力。</p>
              </div>
              <div class="sim-param-group">
                <h3 class="sim-param-group-title">校核工况</h3>
                <div class="sim-fields">
                  <div class="sim-field">
                    <label for="v0">制动初速度 v₀ <span class="sim-param-unit">km/h</span></label>
                    <input class="sim-param-numbox" type="number" id="v0" min="0" max="500" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="phi">路面附着系数 φ</label>
                    <input class="sim-param-numbox" type="number" id="phi" min="0" max="2" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="tDelay">机构延迟 t₁ <span class="sim-param-unit">s</span></label>
                    <input class="sim-param-numbox" type="number" id="tDelay" min="0" step="any">
                  </div>
                  <div class="sim-field">
                    <label for="tRamp">建压时间 t₂ <span class="sim-param-unit">s</span></label>
                    <input class="sim-param-numbox" type="number" id="tRamp" min="0" step="any">
                  </div>
                </div>
              </div>
            </div>
          </details>
        </aside>
        <section class="sim-main-area" aria-label="仿真图表">
        <!-- Chart 0 -->
        <div class="sim-chart-panel active" id="sim-panel-0">
          <div class="sim-chart-header">
            <div>
              <h2 class="sim-chart-title">制动力分配曲线（I 曲线 与 β 线）</h2>
            </div>
            <button type="button" class="sim-dl-btn" onclick="simDownloadChart('sim-chart0','制动力分配曲线')">⬇ 下载图片</button>
          </div>
          <div class="sim-canvas-wrap"><canvas id="sim-chart0" class="sim-canvas" role="img" aria-label="制动力分配曲线（I 曲线 与 β 线）"></canvas></div>
          <div class="sim-info-bar" id="sim-info0"></div>
        </div>
        <!-- Chart 1 -->
        <div class="sim-chart-panel" id="sim-panel-1">
          <div class="sim-chart-header">
            <div>
              <h2 class="sim-chart-title">利用附着系数与制动强度曲线</h2>
            </div>
            <button type="button" class="sim-dl-btn" onclick="simDownloadChart('sim-chart1','利用附着系数曲线')">⬇ 下载图片</button>
          </div>
          <div class="sim-canvas-wrap"><canvas id="sim-chart1" class="sim-canvas" role="img" aria-label="利用附着系数与制动强度曲线"></canvas></div>
          <div class="sim-info-bar" id="sim-info1"></div>
        </div>
        <!-- Chart 2 -->
        <div class="sim-chart-panel" id="sim-panel-2">
          <div class="sim-chart-header">
            <div>
              <h2 class="sim-chart-title">制动效率与附着系数关系曲线</h2>
            </div>
            <button type="button" class="sim-dl-btn" onclick="simDownloadChart('sim-chart2','制动效率曲线')">⬇ 下载图片</button>
          </div>
          <div class="sim-canvas-wrap"><canvas id="sim-chart2" class="sim-canvas" role="img" aria-label="制动效率与附着系数关系曲线"></canvas></div>
          <div class="sim-info-bar" id="sim-info2"></div>
        </div>
        <!-- Chart 3 -->
        <div class="sim-chart-panel" id="sim-panel-3">
          <div class="sim-chart-header">
            <div>
              <h2 class="sim-chart-title">不同初速度下的制动距离与附着系数关系</h2>
            </div>
            <button type="button" class="sim-dl-btn" onclick="simDownloadChart('sim-chart3','制动距离vs附着系数')">⬇ 下载图片</button>
          </div>
          <div class="sim-canvas-wrap"><canvas id="sim-chart3" class="sim-canvas" role="img" aria-label="不同初速度下的制动距离与附着系数关系"></canvas></div>
          <div class="sim-info-bar" id="sim-info3"></div>
        </div>
        <!-- Chart 4 -->
        <div class="sim-chart-panel" id="sim-panel-4">
          <div class="sim-chart-header">
            <div>
              <h2 class="sim-chart-title">不同附着系数下的制动距离与制动初速度关系</h2>
            </div>
            <button type="button" class="sim-dl-btn" onclick="simDownloadChart('sim-chart4','制动距离vs初速度')">⬇ 下载图片</button>
          </div>
          <div class="sim-canvas-wrap"><canvas id="sim-chart4" class="sim-canvas" role="img" aria-label="不同附着系数下的制动距离与制动初速度关系"></canvas></div>
          <div class="sim-info-bar" id="sim-info4"></div>
        </div>
      </section>
      </div>
    </div>
  </main>
<script>
// 制动性模型及五种曲线取自第9章 17.90、17.91 的仿真模块。

const BrakeModel = (() => {
  const g = 9.81;
  const positive = (...values) => values.every(value => Number.isFinite(value) && value > 0);
  const nonnegative = (...values) => values.every(value => Number.isFinite(value) && value >= 0);

  function lockLimits(load, beta, mu) {
    const { front, k } = load;
    const frontDenom = beta - mu * k;
    const zFront = frontDenom > 0 ? mu * front / frontDenom : Infinity;
    const zRear = mu * (1 - front) / (1 - beta + mu * k);
    const lift = (1 - front) / k;
    const zRoad = Math.min(mu, lift);
    const zFirst = Math.min(zFront, zRear, zRoad);
    const first = Math.abs(zFront - zRear) < 1e-9 ? 'both' : zFront < zRear ? 'front' : 'rear';
    const qEnd = mu > lift ? lift / beta
      : Math.max(mu * (front + k * zRoad) / beta, mu * (1 - front - k * zRoad) / (1 - beta));
    return { zFront, zRear, zFirst, first, zRoad, qEnd, lift };
  }

  function brakingForce(load, beta, mu, q, limits = lockLimits(load, beta, mu)) {
    if (q <= limits.zFirst) return q;
    if (q >= limits.qEnd) return limits.zRoad;
    const z = limits.first === 'front'
      ? (mu * load.front + (1 - beta) * q) / (1 - mu * load.k)
      : (mu * (1 - load.front) + beta * q) / (1 + mu * load.k);
    return Math.min(z, limits.zRoad);
  }

  // q is commanded tyre force divided by weight. After each axle reaches
  // adhesion, its force is capped at mu times its dynamic normal load.
  function stop(load, beta, mu, qAvailable, speed, delay, ramp) {
    const limits = lockLimits(load, beta, mu);
    const j = g * brakingForce(load, beta, mu, qAvailable, limits);
    const u = speed / 3.6;
    if (u === 0) return { j, distance: 0, time: 0, limits };
    if (!(j > 0)) return { j, distance: null, time: null, limits };

    let velocity = u;
    let distance = u * delay;
    let time = delay;
    if (ramp > 0) {
      const breakpoints = [0, limits.zFirst, limits.qEnd, qAvailable]
        .filter(q => q >= 0 && q <= qAvailable);
      for (let i = 1; i < breakpoints.length; i++) {
        const q0 = breakpoints[i - 1], q1 = breakpoints[i];
        const duration = (q1 - q0) / qAvailable * ramp;
        if (duration <= 0) continue;
        const a0 = g * brakingForce(load, beta, mu, q0, limits);
        const a1 = g * brakingForce(load, beta, mu, q1, limits);
        const jerk = Math.max(0, a1 - a0) / duration;
        const stopsHere = velocity <= (a0 + a1) * duration / 2;
        const t = stopsHere ? 2 * velocity / (a0 + Math.sqrt(a0 ** 2 + 2 * jerk * velocity)) : duration;
        distance += velocity * t - a0 * t ** 2 / 2 - jerk * t ** 3 / 6;
        time += t;
        if (stopsHere) return { j, distance, time, limits };
        velocity -= (a0 + a1) * duration / 2;
      }
    }
    return { j, distance: distance + velocity ** 2 / (2 * j), time: time + velocity / j, limits };
  }

  return { g, positive, nonnegative, lockLimits, stop };
})();

const AXLE_NAMES = { front: '前轴', rear: '后轴', both: '前后轴同时' };

const el = id => document.getElementById(id);
function getN(id) { return el(id)?.valueAsNumber ?? NaN; }
function fmt(value, digits = 2) { return Number.isFinite(value) ? value.toFixed(digits) : '—'; }

function table(headers, rows) {
  return `<table class="result-table"><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(row => `<tr>${row.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function lockText(q, lim) {
  if (!Number.isFinite(q)) return '待核算制动能力';
  if (lim.zRoad === 0) return '地面无可用附着';
  if (q + 1e-9 < lim.zFirst) return '建压至上限，前后轴均未到极限';
  return `${AXLE_NAMES[lim.first]}先到附着极限`;
}

const { g, positive, nonnegative } = BrakeModel;
const DEFAULT_PARAMETERS = {
  m0: 665, ma: 980, hg_empty: 510, hg_full: 530, front_empty: 40, front_full: 44,
  L: 1940, re: 247.2, beta: 0.608, pressure: 6.9764486297,
  v0: 50, phi: 0.7, tDelay: 0.1, tRamp: 0.3,
};
// 参考工具默认工况的单侧制动器力矩增益 K₁、K₂。
const BRAKE_PRESETS = {
  disc: { gainFront: 76.9181960251, gainRear: 47.9407038938 },
  drum: { gainFront: 79.3880463562, gainRear: 182.0394728237 },
};
const PARAMETER_IDS = [...Object.keys(DEFAULT_PARAMETERS), 'gainFront', 'gainRear'];
let design;
let currentSimTab = 0;

function readSimulation() {
  const { m0, ma, hg_empty, hg_full, front_empty, front_full, L, re, beta: designBeta,
    pressure, gainFront, gainRear, v0, phi, tDelay, tRamp } =
    Object.fromEntries(PARAMETER_IDS.map(id => [id, getN(id)]));

  if (!positive(m0, ma, hg_empty, hg_full, L) || ma < m0 ||
      ![front_empty, front_full].every(share => share > 0 && share < 100)) {
    return { error: '请检查质量、轴距和质心高度。满载质量应不小于空载，前轴荷占比需在 0% 与 100% 之间。' };
  }
  if (!nonnegative(phi) || phi > 2) return { error: '路面附着系数 φ 需在 0～2 之间。' };

  const samePressure = el('pressureMode').value === 'equal';
  const beta = samePressure ? gainFront / (gainFront + gainRear) : designBeta;
  if (!(beta > 0 && beta < 1)) {
    return { error: samePressure ? '请填写有效的前后轴单侧力矩增益。' : '制动力分配系数需满足 0 < β < 1。' };
  }

  const load = (mass, height, frontShare) => ({ G: mass * g, k: height / L, front: frontShare / 100 });
  const empty = load(m0, hg_empty, front_empty);
  const full = load(ma, hg_full, front_full);
  const spec = { empty, full, phi, v0, tDelay, tRamp };
  const performance = {
    beta, syncEmpty: (beta - empty.front) / empty.k, syncFull: (beta - full.front) / full.k,
  };
  const result = { spec, performance };

  if (!positive(re, gainFront, gainRear) || !nonnegative(pressure)) {
    return { ...result, error: '请检查车轮有效半径、可用管压及前后轴单侧力矩增益。' };
  }
  if (!nonnegative(v0, tDelay, tRamp) || v0 > 500) {
    return { ...result, error: '制动初速度需在 0～500 km/h 之间，延迟和建压时间需为非负数。' };
  }

  // 相对管压按固定 β 配置，压力最高的一轴系数为 1。
  const scale = Math.max(beta / gainFront, (1 - beta) / gainRear);
  const pRatio1 = beta / gainFront / scale;
  const pRatio2 = (1 - beta) / gainRear / scale;
  const T1 = pressure * pRatio1 * gainFront;
  const T2 = pressure * pRatio2 * gainRear;
  const qFor = load => 2 * (T1 + T2) / ((re / 1000) * load.G);
  const emptyQ = qFor(empty);
  const fullQ = qFor(full);
  if (!nonnegative(emptyQ, fullQ)) return { ...result, error: '请输入有效范围内的制动系统参数。' };

  return {
    spec,
    hyd: { pAvailable: pressure },
    performance: {
      ...performance, emptyQ, fullQ,
      empty: BrakeModel.stop(empty, beta, phi, emptyQ, v0, tDelay, tRamp),
      full: BrakeModel.stop(full, beta, phi, fullQ, v0, tDelay, tRamp),
    },
  };
}

function renderScenario() {
  const { spec, performance, hyd, error } = design;
  const loadName = el('simLoad').value === 'empty' ? '空载' : '满载';
  el('simError').hidden = !error;
  el('simError').textContent = error ?? '';
  el('simScenario').hidden = !hyd;
  el('simInputState').textContent = performance
    ? 'β = ' + fmt(performance.beta, 3) + ' · 可用管压 ' + fmt(hyd?.pAvailable) + ' MPa · 距离曲线按' + loadName + '绘制'
    : '请检查仿真参数';
  if (!hyd) {
    el('simulationCaseResults').innerHTML = '';
    return;
  }

  el('simScenario').textContent = '统一校核工况　' + fmt(spec.v0, 1) + ' km/h，φ=' + fmt(spec.phi) +
    '，延迟 ' + fmt(spec.tDelay) + ' s，建压 ' + fmt(spec.tRamp) + ' s';
  const rows = [
    ['满载', performance.full, performance.fullQ],
    ['空载', performance.empty, performance.emptyQ],
  ].map(([label, stop, q]) => [
    label, fmt(stop.j), stop.distance == null ? '无有限制动距离' : fmt(stop.distance, 1) + ' m',
    lockText(q, stop.limits),
  ]);
  el('simulationCaseResults').innerHTML =
    table(['载荷', '稳态减速度（m/s²）', '含响应制动距离', '首轴附着状态'], rows);
}

function updateSimulation() {
  el('beta').disabled = el('pressureMode').value === 'equal';
  design = readSimulation();
  renderScenario();
  simDraw(currentSimTab);
}

function resetSimulation() {
  const parameters = { ...DEFAULT_PARAMETERS, ...BRAKE_PRESETS[el('simPreset').value] };
  Object.entries(parameters).forEach(([id, value]) => { el(id).value = value; });
  el('pressureMode').value = 'matched';
  el('simLoad').value = 'full';
  simSpeeds.splice(0, simSpeeds.length, ...DEFAULT_SPEEDS);
  simMus.splice(0, simMus.length, ...DEFAULT_MUS);
  simRenderSpeedInputs();
  simRenderMuInputs();
  updateSimulation();
}

const SIM_COLORS = ['#00d4ff','#ff6b35','#39ff14','#ffd700','#ff4081'];
const SIM_WORD_COLORS = ['#1565C0','#C62828','#2E7D32','#E65100','#6A1B9A'];

class SimWordChart {
  constructor(ctx, W, H, opts={}) {
    this.ctx = ctx;
    this.W = W; this.H = H;
    this.opts = Object.assign({
      xmin:0,xmax:1,ymin:0,ymax:1,
      xlabel:'X',ylabel:'Y',
      padL:90,padR:40,padT:50,padB:72
    }, opts);
    this.series = [];
  }
  addSeries(xs, ys, color, dash=[], label='', lineW=2.5) {
    this.series.push({xs,ys,color,dash,label,lineW});
  }
  px(x){const {xmin,xmax,padL,padR}=this.opts;return padL+(x-xmin)/(xmax-xmin)*(this.W-padL-padR);}
  py(y){const {ymin,ymax,padT,padB}=this.opts;return this.H-padB-(y-ymin)/(ymax-ymin)*(this.H-padT-padB);}
  niceNum(range,round){
    const exp=Math.floor(Math.log10(range));const f=range/Math.pow(10,exp);let nf;
    if(round){if(f<1.5)nf=1;else if(f<3)nf=2;else if(f<7)nf=5;else nf=10;}
    else{if(f<=1)nf=1;else if(f<=2)nf=2;else if(f<=5)nf=5;else nf=10;}
    return nf*Math.pow(10,exp);
  }
  render(legendItems, title, legendPos='topleft') {
    const ctx=this.ctx;
    const {xmin,xmax,ymin,ymax,xlabel,ylabel,padL,padR,padT,padB}=this.opts;
    const W=this.W,H=this.H;

    // White background
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);

    // Light border around whole image
    ctx.strokeStyle='#cccccc';
    ctx.lineWidth=1;
    ctx.strokeRect(1,1,W-2,H-2);

    // Title at top
    if(title){
      ctx.fillStyle='#1a1a2e';
      ctx.font='bold 18px "Microsoft YaHei",SimHei,sans-serif';
      ctx.textAlign='center';
      ctx.fillText(title, W/2, 30);
      // Subtitle
      ctx.fillStyle='#555';
      ctx.font='12px monospace';
      ctx.fillText('广西大学 · 车辆工程专业 · 《汽车设计》课程教学团队', W/2, 46);
    }

    // Grid
    const xRange=xmax-xmin,yRange=ymax-ymin;
    const xTick=this.niceNum(xRange/6,false);
    const yTick=this.niceNum(yRange/6,false);
    const xStart=Math.ceil(xmin/xTick)*xTick;
    const yStart=Math.ceil(ymin/yTick)*yTick;

    ctx.strokeStyle='rgba(0,0,0,0.1)';
    ctx.lineWidth=1;
    for(let x=xStart;x<=xmax+1e-9;x+=xTick){
      const px=this.px(x);
      ctx.beginPath();ctx.moveTo(px,padT);ctx.lineTo(px,H-padB);ctx.stroke();
    }
    for(let y=yStart;y<=ymax+1e-9;y+=yTick){
      const py=this.py(y);
      ctx.beginPath();ctx.moveTo(padL,py);ctx.lineTo(W-padR,py);ctx.stroke();
    }

    // Tick labels
    ctx.fillStyle='#222222';
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    for(let x=xStart;x<=xmax+1e-9;x+=xTick){
      ctx.fillText(+x.toPrecision(4),this.px(x),H-padB+20);
    }
    ctx.textAlign='right';
    for(let y=yStart;y<=ymax+1e-9;y+=yTick){
      ctx.fillText(+y.toPrecision(4),padL-10,this.py(y)+5);
    }

    // Axis box (all 4 sides)
    ctx.strokeStyle='#333333';
    ctx.lineWidth=1.5;
    ctx.strokeRect(padL,padT,W-padL-padR,H-padT-padB);

    // Axis titles
    ctx.fillStyle='#111111';
    ctx.font='bold 15px "Microsoft YaHei",SimHei,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(xlabel,padL+(W-padL-padR)/2,H-padB+44);
    ctx.save();
    ctx.translate(18,padT+(H-padT-padB)/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(ylabel,0,0);
    ctx.restore();

    // Clip & draw series
    ctx.save();
    ctx.beginPath();
    ctx.rect(padL,padT,W-padL-padR,H-padT-padB);
    ctx.clip();
    for(const s of this.series){
      ctx.beginPath();
      ctx.strokeStyle=s.color;
      ctx.lineWidth=s.lineW;
      ctx.setLineDash(s.dash);
      let first=true;
      for(let i=0;i<s.xs.length;i++){
        const y=s.ys[i];
        if(y===null||y===undefined||isNaN(y)){first=true;continue;}
        const px=this.px(s.xs[i]);const py=this.py(y);
        if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
      }
      ctx.stroke();ctx.setLineDash([]);
    }
    ctx.restore();

    // Legend
    const items=legendItems||this.series.filter(s=>s.label);
    if(items.length){
      const lineH=24;
      const boxW=220,boxH=items.length*lineH+20;
      const margin=16;
      let lx,ly;
      if(legendPos==='topleft')     { lx=padL+margin;        ly=padT+margin; }
      else if(legendPos==='topright')    { lx=W-padR-boxW-margin; ly=padT+margin; }
      else if(legendPos==='bottomleft')  { lx=padL+margin;        ly=H-padB-boxH-margin; }
      else if(legendPos==='bottomright') { lx=W-padR-boxW-margin; ly=H-padB-boxH-margin; }
      else { lx=padL+margin; ly=padT+margin; }
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.strokeStyle='#aaaaaa';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(lx,ly,boxW,boxH,4);ctx.fill();ctx.stroke();
      items.forEach((item,i)=>{
        const y=ly+14+i*lineH+lineH/2;
        ctx.beginPath();
        ctx.strokeStyle=item.color;ctx.lineWidth=2.5;
        ctx.setLineDash(item.dash||[]);
        ctx.moveTo(lx+10,y);ctx.lineTo(lx+44,y);
        ctx.stroke();ctx.setLineDash([]);
        ctx.fillStyle='#111111';
        ctx.font='14px "Microsoft YaHei",SimHei,sans-serif';
        ctx.textAlign='left';
        ctx.fillText(item.label,lx+52,y+5);
      });
    }
  }
}

class SimChart {
  constructor(canvasId, opts={}) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.opts = Object.assign({
      xmin:0,xmax:1,ymin:0,ymax:1,
      xlabel:'X',ylabel:'Y',
      padL:80,padR:36,padT:28,padB:64
    }, opts);
    this.series = [];
  }

  resize() {
    const wrap = this.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    this.opts.padL = w < 440 ? 58 : 80;
    this.opts.padR = w < 440 ? 18 : 36;
    this.canvas.width  = w * dpr;
    this.canvas.height = h * dpr;
    this.ctx.scale(dpr, dpr);
    this.W = w;
    this.H = h;
  }

  addSeries(xs, ys, color, dash=[], label='', lineW=2) {
    this.series.push({xs,ys,color,dash,label,lineW});
  }

  px(x) {
    const {xmin,xmax,padL,padR} = this.opts;
    return padL + (x-xmin)/(xmax-xmin)*(this.W-padL-padR);
  }
  py(y) {
    const {ymin,ymax,padT,padB} = this.opts;
    return this.H-padB - (y-ymin)/(ymax-ymin)*(this.H-padT-padB);
  }

  niceNum(range, round) {
    const exp = Math.floor(Math.log10(range));
    const f = range / Math.pow(10, exp);
    let nf;
    if(round) { if(f<1.5)nf=1; else if(f<3)nf=2; else if(f<7)nf=5; else nf=10; }
    else { if(f<=1)nf=1; else if(f<=2)nf=2; else if(f<=5)nf=5; else nf=10; }
    return nf * Math.pow(10, exp);
  }

  render(legendItems, legendPos='topleft') {
    this.resize();
    const ctx = this.ctx;
    const {xmin,xmax,ymin,ymax,xlabel,ylabel,padL,padR,padT,padB} = this.opts;
    const W=this.W, H=this.H;

    // BG
    ctx.fillStyle = '#0c1322';
    ctx.fillRect(0,0,W,H);

    // Grid
    const xRange = xmax-xmin, yRange = ymax-ymin;
    const xTick = this.niceNum(xRange/6, false);
    const yTick = this.niceNum(yRange/6, false);
    const xStart = Math.ceil(xmin/xTick)*xTick;
    const yStart = Math.ceil(ymin/yTick)*yTick;

    ctx.strokeStyle = 'rgba(0,212,255,0.1)';
    ctx.lineWidth = 1;
    for(let x=xStart;x<=xmax+1e-9;x+=xTick) {
      const px = this.px(x);
      ctx.beginPath(); ctx.moveTo(px,padT); ctx.lineTo(px,H-padB); ctx.stroke();
    }
    for(let y=yStart;y<=ymax+1e-9;y+=yTick) {
      const py = this.py(y);
      ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(W-padR,py); ctx.stroke();
    }

    // Axis tick labels
    ctx.fillStyle = 'rgba(160,200,230,0.85)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    for(let x=xStart;x<=xmax+1e-9;x+=xTick) {
      const px = this.px(x);
      ctx.fillText(+x.toPrecision(4), px, H-padB+20);
    }
    ctx.textAlign = 'right';
    for(let y=yStart;y<=ymax+1e-9;y+=yTick) {
      const py = this.py(y);
      ctx.fillText(+y.toPrecision(4), padL-10, py+5);
    }

    // Axis lines
    ctx.strokeStyle = 'rgba(0,212,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-padR,H-padB);
    ctx.stroke();

    // Axis titles
    ctx.fillStyle = '#a8cce0';
    ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(xlabel, padL+(W-padL-padR)/2, H-padB+44);
    ctx.save();
    ctx.translate(16, padT+(H-padT-padB)/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(ylabel, 0, 0);
    ctx.restore();

    // Clip & draw series
    ctx.save();
    ctx.beginPath();
    ctx.rect(padL, padT, W-padL-padR, H-padT-padB);
    ctx.clip();
    for(const s of this.series) {
      ctx.beginPath();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.lineW + 0.5;
      ctx.setLineDash(s.dash);
      let first = true;
      for(let i=0;i<s.xs.length;i++) {
        const y = s.ys[i];
        if(y===null||y===undefined||isNaN(y)){first=true;continue;}
        const px = this.px(s.xs[i]);
        const py = this.py(y);
        if(first){ctx.moveTo(px,py);first=false;}
        else ctx.lineTo(px,py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();

    // Legend — position controlled by legendPos
    const items = legendItems || this.series.filter(s=>s.label);
    if(items.length) {
      const lineH = 24;
      const margin = 12;
      const boxW = Math.min(210, W - padL - padR - 2 * margin);
      const boxH = items.length * lineH + 16;
      let lx, ly;
      if(legendPos==='topleft')     { lx=padL+margin;           ly=padT+margin; }
      else if(legendPos==='topright')    { lx=W-padR-boxW-margin;    ly=padT+margin; }
      else if(legendPos==='bottomleft')  { lx=padL+margin;           ly=H-padB-boxH-margin; }
      else if(legendPos==='bottomright') { lx=W-padR-boxW-margin;    ly=H-padB-boxH-margin; }
      else { lx=padL+margin; ly=padT+margin; } // default topleft

      ctx.fillStyle = 'rgba(8,13,24,0.9)';
      ctx.strokeStyle = 'rgba(0,212,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(lx,ly,boxW,boxH,5);
      ctx.fill(); ctx.stroke();
      items.forEach((item,i) => {
        const y = ly + 8 + i * lineH + lineH / 2;
        ctx.beginPath();
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 3;
        ctx.setLineDash(item.dash||[]);
        ctx.moveTo(lx+10,y); ctx.lineTo(lx+40,y);
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#ddeaf8';
        ctx.font = '14px "Microsoft YaHei",sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(item.label, lx+48, y+5, boxW-56);
      });
    }
  }
}

const DEFAULT_SPEEDS = [30, 50, 70, 90];
const simSpeeds = DEFAULT_SPEEDS.slice();
const DEFAULT_MUS = [0.3, 0.5, 0.7, 0.9];
const simMus = DEFAULT_MUS.slice();
const lineDashes = [[], [10, 6], [3, 4], [15, 5, 3, 5], [], [8, 4], [3, 3], [12, 4, 3, 4]];
const sequence = (start, end, count = 151) =>
  Array.from({ length: count }, (_, i) => start + (end - start) * i / (count - 1));

function simRenderValues(values, name, container, step, min, max) {
  el(container).innerHTML = values.map((v, i) => `<div class="sim-param-row">
    <label class="sim-param-label" for="${name}${i}">${name === 'speed' ? '速度（km/h）' : '附着系数'} ${i + 1}</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input id="${name}${i}" class="sim-param-numbox" type="number" value="${Number.isFinite(v) ? v : ''}"
        step="${step}" min="${min}" max="${max}" oninput="simSetValue('${name}',${i},this.valueAsNumber)">
      ${values.length > 1 ? `<button type="button" class="sim-dyn-del-btn" aria-label="移除第 ${i + 1} 条曲线" onclick="simRemoveValue('${name}',${i})">✕</button>` : ''}
    </div></div>`).join('');
}
function simRenderSpeedInputs() {
  simRenderValues(simSpeeds, 'speed', 'sim-speed-inputs', 1, 0, 500);
  el('sim-add-speed').disabled = simSpeeds.length >= 8;
}
function simRenderMuInputs() {
  simRenderValues(simMus, 'mu', 'sim-mu-inputs', 0.01, 0, 2);
  el('sim-add-mu').disabled = simMus.length >= 8;
}
function simSetValue(kind, i, value) {
  (kind === 'speed' ? simSpeeds : simMus)[i] = value;
  simDraw(currentSimTab);
}
function simRemoveValue(kind, i) {
  const values = kind === 'speed' ? simSpeeds : simMus;
  if (values.length <= 1) return;
  values.splice(i, 1);
  if (kind === 'speed') simRenderSpeedInputs(); else simRenderMuInputs();
  simDraw(currentSimTab);
}
function simAddSpeed() {
  if (simSpeeds.length >= 8) return;
  simSpeeds.push(Math.min((simSpeeds.filter(Number.isFinite).at(-1) ?? 60) + 20, 500));
  simRenderSpeedInputs();
  simDraw(currentSimTab);
}
function simAddMu() {
  if (simMus.length >= 8) return;
  simMus.push(Math.min(+((simMus.filter(Number.isFinite).at(-1) ?? 0.6) + 0.1).toFixed(2), 2));
  simRenderMuInputs();
  simDraw(currentSimTab);
}

function forceGraph(spec, p) {
  const ideal = (load, name, palette) => {
    const z = sequence(0, Math.min((1 - load.front) / load.k, Math.max(1, spec.phi)));
    return { x: z.map(v => load.G * v * (load.front + load.k * v)),
      y: z.map(v => load.G * v * Math.max(0, 1 - load.front - load.k * v)), name, palette };
  };
  const force = spec.full.G * Math.max(1, spec.phi);
  const slope = { x: [0, p.beta * force], y: [0, (1 - p.beta) * force], name: 'β 线（制动器指令）', palette: 1, dash: [10, 6] };
  const series = [ideal(spec.empty, 'I 曲线（空载）', 2), ideal(spec.full, 'I 曲线（满载）', 0), slope];
  return {
    series, xmax: Math.ceil(Math.max(...series.flatMap(v => v.x)) / 1000) * 1000,
    ymax: Math.ceil(Math.max(...series.flatMap(v => v.y)) / 1000) * 1000,
    xLabel: '前轴制动器制动力 F₁ / N', yLabel: '后轴制动器制动力 F₂ / N',
    note: `F₂ = [(1−β)/β]F₁。当前斜率 ${fmt((1 - p.beta) / p.beta, 4)}；空载与满载 φ₀ 为 ${fmt(p.syncEmpty, 3)} / ${fmt(p.syncFull, 3)}。`,
    legend: 'topright',
  };
}

function utilizedAdhesionGraph(spec, p) {
  const hi = Math.max(1, spec.phi);
  const z = sequence(0, hi);
  const series = [];
  for (const [load, title, palette] of [[spec.empty, '空载', 2], [spec.full, '满载', 0]]) {
    const front = z.map(q => p.beta * q / (load.front + load.k * q));
    const rear = z.map(q => {
      const normal = 1 - load.front - load.k * q;
      return normal > 0 && (1 - p.beta) * q / normal <= hi * 1.45 ? (1 - p.beta) * q / normal : null;
    });
    series.push({ x: z, y: front, name: title + '前轴', palette },
      { x: z, y: rear, name: title + '后轴', palette, dash: [10, 6] });
  }
  series.push({ x: [0, hi], y: [0, hi], name: '两轴理想 φ=z', palette: 4, dash: [3, 4] });
  return { series, xmax: hi, ymax: hi * 1.45, xLabel: '制动强度 z = j/g', yLabel: '所需附着系数',
    note: '沿固定 β 提高制动强度，两轴所需附着系数越大的一轴越早到达同一路面的附着上限。', legend: 'topleft' };
}

function efficiencyGraph(spec, p) {
  const hi = Math.max(1, spec.phi);
  const mu = sequence(0.02, hi);
  const series = [];
  for (const [load, title, q, palette] of [[spec.empty, '空载', p.emptyQ, 2], [spec.full, '满载', p.fullQ, 0]]) {
    const first = mu.map(v => BrakeModel.lockLimits(load, p.beta, v).zFirst);
    series.push({ x: mu, y: first.map((z, i) => z / mu[i] * 100), name: title + '分配上限', palette });
    if (Number.isFinite(q)) series.push({ x: mu, y: first.map((z, i) => Math.min(z, q) / mu[i] * 100),
      name: title + '含液压约束', palette, dash: [10, 6] });
  }
  return { series, xmin: 0, xmax: hi, ymax: 105, xLabel: '路面附着系数 φ', yLabel: '首轴达限前的附着利用率 / %',
    note: '实线为仅由轴荷与 β 决定的首轴达限强度与 φ 之比。虚线进一步计入可用液压的限制。', legend: 'bottomleft' };
}

function distanceGraph(index, spec, p) {
  const isEmpty = el('simLoad').value === 'empty';
  const load = isEmpty ? spec.empty : spec.full;
  const q = isEmpty ? p.emptyQ : p.fullQ;
  if (!Number.isFinite(q)) return null;
  const byAdhesion = index === 3;
  const values = (byAdhesion ? simSpeeds : simMus).filter(v => v >= 0 && v <= (byAdhesion ? 500 : 2));
  if (!values.length) return null;
  const xmin = byAdhesion ? 0.1 : 0;
  const xmax = byAdhesion ? Math.max(1, spec.phi) : Math.max(100, Math.ceil(spec.v0 / 10) * 10);
  const x = sequence(xmin, xmax);
  const series = values.map((value, i) => ({
    x, y: x.map(v => BrakeModel.stop(load, p.beta, byAdhesion ? v : value, q, byAdhesion ? value : v,
      spec.tDelay, spec.tRamp).distance),
    name: byAdhesion ? value + ' km/h' : 'φ = ' + value, palette: i, dash: lineDashes[i],
  }));
  const distances = series.flatMap(v => v.y).filter(Number.isFinite);
  return { series, xmin, xmax, ymax: Math.max(10, Math.ceil(Math.max(0, ...distances) / 10) * 10),
    xLabel: byAdhesion ? '路面附着系数 φ' : '制动初速度 / (km/h)', yLabel: '制动距离 / m',
    note: `${isEmpty ? '空载' : '满载'}；β=${fmt(p.beta, 3)}；可用管压 ${fmt(design.hyd.pAvailable)} MPa。
      ${!byAdhesion && values.includes(0) ? 'φ=0 时车辆从非零初速无法制停。' : '两张距离图使用同一制动模型。'}`,
    legend: 'topleft' };
}

function graphData(index) {
  const { spec, performance: p } = design;
  if (!p) return null;
  if (index === 0) return forceGraph(spec, p);
  if (index === 1) return utilizedAdhesionGraph(spec, p);
  if (index === 2) return efficiencyGraph(spec, p);
  return distanceGraph(index, spec, p);
}

function renderGraph(chart, graph, colors, title) {
  for (const series of graph.series) {
    chart.addSeries(series.x, series.y, colors[series.palette % colors.length], series.dash ?? [], series.name, title ? 3 : 2.5);
  }
  if (chart instanceof SimWordChart) chart.render(null, title, graph.legend);
  else chart.render(null, graph.legend);
}

function graphOptions(graph) {
  return { xmin: graph.xmin ?? 0, xmax: graph.xmax, ymin: 0, ymax: graph.ymax,
    xlabel: graph.xLabel, ylabel: graph.yLabel };
}

function simDraw(index) {
  const graph = graphData(index);
  const panel = el('sim-panel-' + index);
  const canvas = el('sim-chart' + index);
  const downloadButton = panel.querySelector('.sim-dl-btn');
  downloadButton.disabled = !graph;
  if (!graph) {
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    el('sim-info' + index).textContent = design.error || '请至少输入一条曲线的有效速度或附着系数。';
    return;
  }
  renderGraph(new SimChart(canvas.id, graphOptions(graph)), graph, SIM_COLORS);
  el('sim-info' + index).textContent = graph.note;
}

function simSwitchTab(index) {
  currentSimTab = index;
  document.querySelectorAll('.sim-tab-btn').forEach((button, i) => {
    button.classList.toggle('active', i === index);
    button.setAttribute('aria-pressed', String(i === index));
  });
  document.querySelectorAll('.sim-chart-panel').forEach((panel, i) => {
    panel.classList.toggle('active', i === index);
  });
  el('sim-params-3').hidden = index !== 3;
  el('sim-params-4').hidden = index !== 4;
  simDraw(index);
}

function simDownloadChart(id, name) {
  const graph = graphData(Number(id.at(-1)));
  if (!graph) {
    alert('请先补齐参数并生成曲线。');
    return;
  }
  const canvas = document.createElement('canvas');
  const width = 1600, height = 1000;
  canvas.width = 2 * width;
  canvas.height = 2 * height;
  const context = canvas.getContext('2d');
  context.scale(2, 2);
  const chart = new SimWordChart(context, width, height,
    { ...graphOptions(graph), padL: 100, padR: 50, padT: 80, padB: 82 });
  renderGraph(chart, graph, SIM_WORD_COLORS, name);
  context.fillStyle = '#343e4d';
  context.textAlign = 'center';
  context.font = '14px "Microsoft YaHei", sans-serif';
  context.fillText(graph.note, width / 2, height - 14, width - 40);
  const link = document.createElement('a');
  link.download = name + '_广西大学车辆工程.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

el('sim-parameters').addEventListener('input', updateSimulation);
el('simPreset').addEventListener('change', resetSimulation);
el('simReset').addEventListener('click', resetSimulation);
el('simLoad').addEventListener('change', () => {
  renderScenario();
  simDraw(currentSimTab);
});
window.addEventListener('resize', () => simDraw(currentSimTab));
if (window.matchMedia('(max-width: 760px)').matches) el('sim-settings').open = false;
resetSimulation();
</script>
